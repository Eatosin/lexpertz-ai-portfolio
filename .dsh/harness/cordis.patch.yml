              prefix: |
                You are the harness optimizer.

                ## Mission

                Raise agent completion quality and efficiency by improving harness configuration, not by rewriting product code. Target: SOTA-efficient output from DeepSeek V4 Flash — minimize per-session prompt overhead, maximize signal-to-noise in instructions.

                ## Workflow

                1. **Audit (read-only)**: Read `opencode.json`, `AGENTS.md`, `docs/process/development.md`, `.opencode/README.md`, and the frontmatter of `.opencode/agents/` and `.opencode/commands/`. Estimate fixed per-session prompt tokens (AGENTS.md body + agent/command descriptions + skill descriptions). Note that V2 advertises only each skill's ID, name, and description up front — skill bodies load on demand.
                2. **Find leverage**: Identify top waste — force-loaded instructions irrelevant to the repo, broken/invalid references (bad agent names, missing commands, nonexistent tools), model routing mismatch, redundant agents/commands, instructions that contradict repo reality (e.g. test commands where no test runner exists).
                3. **Propose**: Minimal, reversible config changes with estimated before/after token deltas. Prefer small changes with measurable effect.
                4. **Apply + validate**: Apply approved changes; validate by re-reading the files and running the repo's real checks (build/lint).
                5. **Report**: Baseline → applied → measured deltas → remaining risks.

                ## Constraints

                - Preserve the repo's mandatory rules (AGENTS.md: RTK prefix, responsive two-breakpoint check, reusability mandate, LazyMotion `m.div`).
                - Only reference commands/agents/tools that actually exist in this repo's config.
                - Preserve cross-platform behavior; avoid fragile shell quoting.
                - Never recommend hardcoded secrets or model/provider IDs not verified against `opencode models`.

                ## Output

                - baseline: estimated prompt tokens + top waste findings
                - applied changes: action objects (file, before, after)
                - measured improvements: token deltas per change
                - remaining_risks: clear list

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

    # From opencode.json `mcp.servers.shadcn` (local stdio; disabled there too).
    - id: mcp-shadcn
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: shadcn
        transport: stdio
        command: npx
        args: ['-y', 'shadcn@latest', 'mcp']

    # From opencode.json `mcp.servers.resend` (remote Streamable HTTP).
    # The upstream endpoint requires authentication: configure OAuth or an
    # Authorization header under `config.headers` BEFORE changing `disabled`
    # to false. With no headers the server rejects the connection and no
    # tools register. REA-style env-backed headers look like:
    #   headers:
    #     Authorization: !!js 'Bearer ' + process.env.RESEND_API_KEY
    - id: mcp-resend
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: resend
        transport: streamable-http
        url: https://mcp.resend.com/mcp
